apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasminegraph-ui-frontend-deployment
  labels:
    application: jasminegraph-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      service: jasminegraph-ui
      type: frontend
  template:
    metadata:
      labels:
        service: jasminegraph-ui
        type: frontend
    spec:
      containers:
        - name: frontend
          image: jasminegraph-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: BACKEND
              value: http://backend:8080
            - name: NEXT_PUBLIC_API_URL
              value: http://backend:8080
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

