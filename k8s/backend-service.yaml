apiVersion: v1
kind: Service
metadata:
  # Must be named exactly "backend" — Frontend/next.config.mjs rewrites
  # /backend/:path* to http://backend:8080 over cluster DNS.
  name: backend
  labels:
    application: jasminegraph-ui
spec:
  selector:
    service: jasminegraph-ui
    type: backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
