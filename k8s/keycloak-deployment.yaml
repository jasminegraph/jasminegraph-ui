apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasminegraph-ui-keycloak-deployment
  labels:
    application: jasminegraph-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      service: jasminegraph-ui
      type: keycloak
  template:
    metadata:
      labels:
        service: jasminegraph-ui
        type: keycloak
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      volumes:
        - name: realm-config
          configMap:
            name: jasminegraph-ui-keycloak-realm
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1.1
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jasminegraph-ui-keycloak-secret
                  key: KC_BOOTSTRAP_ADMIN_USERNAME
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jasminegraph-ui-keycloak-secret
                  key: KC_BOOTSTRAP_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: postgres
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: jasminegraph-ui-postgres-secret
                  key: POSTGRES_DB
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: jasminegraph-ui-postgres-secret
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jasminegraph-ui-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_IMPORT
              value: /opt/keycloak/data/import/jasminegraph-realm.json
            - name: KC_IMPORT_STRATEGY
              value: OVERWRITE_EXISTING
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import/jasminegraph-realm.json
              subPath: jasminegraph-realm.json
          # start-dev has no health endpoint enabled by default, so a plain
          # TCP check is the reliable option. First boot runs Quarkus
          # augmentation, which alone can take 2-3 minutes on a CPU-limited
          # host, so startupProbe gates the other probes generously (up to
          # 10 minutes) to avoid killing the container mid-boot; once it
          # succeeds, the tighter liveness/readiness windows take over.
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 15
            failureThreshold: 8
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
