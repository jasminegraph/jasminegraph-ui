name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0'
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  FRONTEND_IMAGE: "${{ secrets.DOCKER_USER }}/jasminegraph-ui-frontend:${{ inputs.tag || github.ref_name }}"
  BACKEND_IMAGE: "${{ secrets.DOCKER_USER }}/jasminegraph-ui-backend:${{ inputs.tag || github.ref_name }}"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Validate requested tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${TAG}" != v* ]]; then
            echo "::error::Tag '${TAG}' is invalid: it must start with 'v' (e.g. v0.1.0)."
            exit 1
          fi
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag '${TAG}' does not exist in ${{ github.repository }}. Create and push the tag first."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.TAG }}
          repository: ${{ github.repository }}
          fetch-depth: 0

      - name: Determine release channel
        id: channel
        run: |
          TAG_SHA=$(git rev-parse "${TAG}^{commit}")
          if git branch -r --contains "${TAG_SHA}" | grep -qE 'origin/main$'; then
            echo "Tag is reachable from main: publishing a stable release."
            echo "prerelease=false" >>"${GITHUB_OUTPUT}"
          else
            echo "Tag is not on main (develop or other branch): publishing a pre-release."
            echo "prerelease=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Docker Build
        run: |
          docker build -t "${FRONTEND_IMAGE}" ./Frontend
          docker build -t "${BACKEND_IMAGE}" ./Backend

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Docker Push
        run: |
          docker push "${FRONTEND_IMAGE}"
          docker push "${BACKEND_IMAGE}"

      - name: Prepare release bundle
        run: |
          BUNDLE_DIR="jasminegraph-ui-${TAG}-compose-bundle"
          mkdir -p "${BUNDLE_DIR}/Backend/src"
          cp docker-compose.yml "${BUNDLE_DIR}/docker-compose.yml"
          cp -r Keycloak "${BUNDLE_DIR}/Keycloak"
          cp -r Backend/src/db-init "${BUNDLE_DIR}/Backend/src/db-init"
          cp -r k8s "${BUNDLE_DIR}/k8s"
          cp start-k8s.sh "${BUNDLE_DIR}/start-k8s.sh"

      - name: Pin image tags in bundled files
        run: |
          BUNDLE_DIR="jasminegraph-ui-${TAG}-compose-bundle"
          # Compose: use the published images instead of building from source,
          # and drop the Playwright test service (needs the tests/ sources).
          FRONTEND_IMAGE="${FRONTEND_IMAGE}" BACKEND_IMAGE="${BACKEND_IMAGE}" yq -i '
            del(.services.playwright) |
            del(.services.frontend.build) |
            del(.services.backend.build) |
            .services.frontend.image = strenv(FRONTEND_IMAGE) |
            .services.backend.image = strenv(BACKEND_IMAGE)
          ' "${BUNDLE_DIR}/docker-compose.yml"
          sed -i "s#image: jasminegraph-frontend:latest#image: ${FRONTEND_IMAGE}#" "${BUNDLE_DIR}"/k8s/*.yaml
          sed -i "s#image: jasminegraph-backend:latest#image: ${BACKEND_IMAGE}#" "${BUNDLE_DIR}"/k8s/*.yaml

      - name: Add bundle README
        run: |
          BUNDLE_DIR="jasminegraph-ui-${TAG}-compose-bundle"
          cat > "${BUNDLE_DIR}/README.md" <<'EOF'
          # JasmineGraph UI ${{ env.TAG }} — Docker Compose Bundle

          This bundle starts the JasmineGraph UI (frontend, backend, PostgreSQL and
          Keycloak) from the published Docker Hub images.

          ## Prerequisites

          - Docker: https://docs.docker.com/get-docker/
          - Docker Compose (bundled with Docker Desktop, or the `docker compose` CLI
            plugin on Linux)
          - A running JasmineGraph cluster. The compose file expects the external
            Docker network `jasminenet`, which is created by the JasmineGraph
            compose stack. If you don't have it, run `docker network create jasminenet`.

          ## Usage

              docker compose up

          | Service    | Port |
          |------------|------|
          | Frontend   | 3000 |
          | Backend    | 8080 |
          | Keycloak   | 8082 |
          | PostgreSQL | 5432 |

          ## Kubernetes

          The `k8s/` folder and `start-k8s.sh` deploy the same stack to a local
          Kubernetes cluster (minikube, k3s or k3d), with image tags pinned to
          this release.
          EOF

      - name: Zip release bundle
        run: |
          BUNDLE_DIR="jasminegraph-ui-${TAG}-compose-bundle"
          zip -r "${BUNDLE_DIR}.zip" "${BUNDLE_DIR}"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JASMINEGRAPH_REPO: miyurud/jasminegraph
        run: |
          chmod +x .github/workflows/scripts/generate-release-notes.sh
          .github/workflows/scripts/generate-release-notes.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          files: jasminegraph-ui-${{ env.TAG }}-compose-bundle.zip
          body_path: RELEASE_NOTES.md
          prerelease: ${{ steps.channel.outputs.prerelease }}
