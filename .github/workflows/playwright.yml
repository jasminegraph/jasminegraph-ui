name: Playwright E2E Tests

on:
  pull_request:
    branches:
      - main

jobs:
  e2e-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # The backend attaches to jasminenet to reach the cluster's Kafka broker.
      # That network is created by the JasmineGraph stack, which is not present
      # here, so create an empty one for the external declaration to resolve
      # against. No e2e spec talks to Kafka.
      - name: Create jasminenet network
        run: docker network create jasminenet || true

      - name: Run all containers with tests
        run: docker compose up --build --abort-on-container-exit

      - name: Show logs if failure
        if: failure()
        run: docker compose logs playwright || true
        